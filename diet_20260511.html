<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
body { font-family: -apple-system, sans-serif; padding: 1rem; background: #fff; color: #1a1a1a; }
.section-label { font-size: 13px; color: #666; font-weight: 500; margin-bottom: 8px; margin-top: 1.2rem; }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.5rem; }
.card { background: #f5f5f3; border-radius: 8px; padding: 0.75rem 1rem; text-align: center; }
.card-label { font-size: 12px; color: #888; margin-bottom: 4px; }
.card-value { font-size: 20px; font-weight: 500; }
.card-unit { font-size: 11px; color: #888; }
.table-wrap { border: 0.5px solid #e0e0e0; border-radius: 12px; overflow: hidden; margin-bottom: 1.5rem; }
table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
thead tr { background: #f5f5f3; }
th { padding: 10px 12px; text-align: center; font-weight: 500; font-size: 12px; color: #888; border-bottom: 0.5px solid #e0e0e0; }
th:first-child { text-align: left; }
td { padding: 10px 12px; text-align: center; border-bottom: 0.5px solid #e0e0e0; }
td:first-child { text-align: left; font-weight: 500; }
tr:last-child td { border-bottom: none; }
.total-row td { background: #f5f5f3; font-weight: 500; }
.goal-row td { font-size: 12px; color: #888; }
.notice { background: #EAF3DE; border-radius: 8px; padding: 0.6rem 1rem; font-size: 13px; color: #3B6D11; margin-bottom: 1rem; }
</style>
</head><body>

<div class="section-label">2026.05.11 (월) — 운동 없음 &nbsp;<span style="display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;font-weight:500;background:#EAF3DE;color:#3B6D11;">금주 26일차 🎉</span></div>

<div class="notice">오늘은 속이 안 좋은 날 — 몸이 쉬고 싶다는 신호, 괜찮아 😄</div>

<div class="cards">
  <div class="card"><div class="card-label">칼로리</div><div class="card-value">~750</div><div class="card-unit">kcal</div></div>
  <div class="card"><div class="card-label">탄수화물</div><div class="card-value">~85</div><div class="card-unit">g</div></div>
  <div class="card"><div class="card-label">단백질</div><div class="card-value">~22</div><div class="card-unit">g</div></div>
  <div class="card"><div class="card-label">지방</div><div class="card-value">~28</div><div class="card-unit">g</div></div>
</div>

<div class="table-wrap">
<table>
  <thead><tr>
    <th style="width:18%">구분</th>
    <th style="width:32%">메뉴</th>
    <th>탄수</th><th>단백질</th><th>지방</th><th>칼로리</th>
  </tr></thead>
  <tbody>
    <tr><td>아침</td><td style="font-size:12px;color:#888">공복</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>
    <tr><td>점심</td><td style="font-size:12px;color:#888">만두국 (만두5개) + 녹두전 ½개</td><td>~55g</td><td>~15g</td><td>~14g</td><td>~400kcal</td></tr>
    <tr><td>간식</td><td style="font-size:12px;color:#888">플레인 스콘</td><td>~30g</td><td>~5g</td><td>~12g</td><td>~240kcal</td></tr>
    <tr><td>저녁</td><td style="font-size:12px;color:#888">— (속 불편, 패스)</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>
    <tr class="total-row"><td>합계</td><td></td><td>~85g</td><td>~20g</td><td>~26g</td><td>~640kcal</td></tr>
  </tbody>
</table>
</div>

</body></html>
